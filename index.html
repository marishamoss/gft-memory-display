            // Calculate Easter Sunday using the Computus algorithm (Gregorian calendar)
            function calculateEaster(year) {
                const a = year % 19;
                const b = Math.floor(year / 100);
                const c = year % 100;
                const d = Math.floor(b / 4);
                const e = b % 4;
                const f = Math.floor((b + 8) / 25);
                const g = Math.floor((b - f + 1) / 3);
                const h = (19 * a + b - d - g + 15) % 30;
                const i = Math.floor(c / 4);
                const k = c % 4;
                const l = (32 + 2 * e + 2 * i - h - k) % 7;
                const m = Math.floor((a + 11 * h + 22 * l) / 451);
                const month = Math.floor((h + l - 7 * m + 114) / 31);
                const day = ((h + l - 7 * m + 114) % 31) + 1;
                return { month, day };
            }

            // Get the Nth occurrence of a weekday in a month
            // weekday: 0=Sunday, 1=Monday, etc.
            // n: 1=first, 2=second, 3=third, 4=fourth
            function getNthWeekday(year, month, weekday, n) {
                const firstDay = new Date(year, month - 1, 1);
                const firstWeekday = firstDay.getDay();
                
                // Calculate the first occurrence of the target weekday
                let firstOccurrence = 1 + ((weekday - firstWeekday + 7) % 7);
                
                // Calculate the nth occurrence
                const nthOccurrence = firstOccurrence + (n - 1) * 7;
                
                return nthOccurrence;
            }

            // Get the last occurrence of a weekday in a month
            function getLastWeekday(year, month, weekday) {
                // Start from the last day of the month
                const lastDay = new Date(year, month, 0);
                const lastDayNum = lastDay.getDate();
                const lastDayWeekday = lastDay.getDay();
                
                // Work backwards to find the last occurrence of the target weekday
                let daysBack = (lastDayWeekday - weekday + 7) % 7;
                return lastDayNum - daysBack;
            }

            function generateChime() {
                const audioContext = new (
                    window.AudioContext || window.webkitAudioContext
                )();
                const duration = 0.3;
                return new Promise((resolve) => {
                    const oscillator = audioContext.createOscillator();
                    const gainNode = audioContext.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    oscillator.frequency.setValueAtTime(
                        800,
                        audioContext.currentTime,
                    );
                    oscillator.frequency.exponentialRampToValueAtTime(
                        400,
                        audioContext.currentTime + duration,
                    );
                    gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(
                        0.01,
                        audioContext.currentTime + duration,
                    );
                    oscillator.start(audioContext.currentTime);
                    oscillator.stop(audioContext.currentTime + duration);
                    setTimeout(resolve, duration * 1000);
                });
            }

                    53: { icon: "🌦️", description: "Drizzle" },
                    55: { icon: "🌧️", description: "Heavy drizzle" },
                    61: { icon: "🌧️", description: "Light rain" },
                    63: { icon: "🌧️", description: "Rain" },
                    65: { icon: "🌧️", description: "Heavy rain" },
                    71: { icon: "🌨️", description: "Light snow" },
                    73: { icon: "🌨️", description: "Snow" },
                    75: { icon: "🌨️", description: "Heavy snow" },
                    77: { icon: "🌨️", description: "Snow grains" },
                    80: { icon: "🌦️", description: "Light showers" },
                    81: { icon: "🌧️", description: "Showers" },
                    82: { icon: "🌧️", description: "Heavy showers" },

                return (
                    weatherMap[code] || {
                        icon: isNightTime ? "🌙" : "🌤️",
                        description: "Unknown",
                    }
                );
            }

            function generateReminders() {
                console.log(
                    "generateReminders called at:",
                    new Date().toLocaleTimeString(),
                );

                allReminders = [];
                const today = new Date();
                const todayDayOfWeek = today.getDay();

                // FIXED: Use local date, not UTC date
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, "0");
                const day = String(today.getDate()).padStart(2, "0");
                const todayDateString = `${year}-${month}-${day}`;

                console.log("Today's date string:", todayDateString);

                SPECIFIC_DATE_EVENTS.forEach((event) => {
                    if (event.date === todayDateString) {
                        allReminders.push({
                            time: event.time,
                            text: event.text,
                            featured: event.featured,
                            icon: event.icon,
                            schedule: true,
                            videoId: event.videoId || null,
                        });
                    }
                });

                WEEKLY_EVENTS.forEach((event) => {
                    if (event.dayOfWeek === todayDayOfWeek) {
                        allReminders.push({
                            time: event.time,
                            text: event.text,
                            featured: event.featured,
                            icon: event.icon,
                            schedule: true,
                        });
                    }
                });

                DAILY_REMINDERS.forEach((reminder) => {
                    allReminders.push({
                        time: reminder.time,
                        text: reminder.text,
                        featured: reminder.featured,
                        icon: reminder.icon,
                        schedule: false,
                        videoId: reminder.videoId || null,
                    });
                });

                WEEKLY_REMINDERS.forEach((reminder) => {
                    if (reminder.dayOfWeek === todayDayOfWeek) {
                        allReminders.push({
                            time: reminder.time,
                            text: reminder.text,
                            featured: reminder.featured,
                            icon: reminder.icon,
                            schedule: false,
                        });
                    }
                });

                RECURRING_REMINDERS.forEach((recurring) => {
                    const startParts = recurring.startTime.split(":");
                    const endParts = recurring.endTime.split(":");
                    const startMinutes =
                        parseInt(startParts[0]) * 60 + parseInt(startParts[1]);
                    const endMinutes =
                        parseInt(endParts[0]) * 60 + parseInt(endParts[1]);
                    for (
                        let minutes = startMinutes;
                        minutes <= endMinutes;
                        minutes += recurring.interval
                    ) {
                        const hours = Math.floor(minutes / 60);
                        const mins = minutes % 60;
                        const timeString = `${hours.toString().padStart(2, "0")}:${mins.toString().padStart(2, "0")}`;
                        allReminders.push({
                            time: timeString,
                            text: recurring.text,
                            featured: recurring.featured,
                            icon: recurring.icon,
                            schedule: false,
                            videoId: recurring.videoId || null,
                        });
                    }
                });

                allReminders.sort((a, b) => a.time.localeCompare(b.time));
                displayReminders();
                displaySuggestions();
            }

            function displayCaregiver() {
                const now = new Date();
                const currentHour = now.getHours();
                const todayDayOfWeek = now.getDay();

                const year = now.getFullYear();
                const month = String(now.getMonth() + 1).padStart(2, "0");
                const day = String(now.getDate()).padStart(2, "0");
                const todayDateString = `${year}-${month}-${day}`;

                let caregiverName = "";
                let isNightShift = currentHour >= 19 || currentHour < 7;

                let heartEmoji;
                if (currentHour >= 8 && currentHour < 18) {
                    heartEmoji = "💜";
                } else if (currentHour >= 18 && currentHour < 21) {
                    heartEmoji = "💚";
                } else {
                    heartEmoji = '<span class="night-heart">❤️</span>';
                }

                if (isNightShift) {
                    let nightShiftDay = todayDayOfWeek;
                    let nightShiftDate = todayDateString;
                    if (currentHour < 7) {
                        const yesterday = new Date(now);
                        yesterday.setDate(yesterday.getDate() - 1);
                        nightShiftDay = yesterday.getDay();
                        const yYear = yesterday.getFullYear();
                        const yMonth = String(
                            yesterday.getMonth() + 1,
                        ).padStart(2, "0");
                        const yDay = String(yesterday.getDate()).padStart(
                            2,
                            "0",
                        );
                        nightShiftDate = `${yYear}-${yMonth}-${yDay}`;
                    }
                    const substituteNight = SUBSTITUTE_NIGHT_CAREGIVERS.find(
                        (c) => c.date === nightShiftDate,
                    );
                    if (substituteNight) {
                        caregiverName = substituteNight.name;
                    } else {
                        const nightCaregiver = NIGHT_CAREGIVERS.find(
                            (c) => c.dayOfWeek === nightShiftDay,
                        );
                        if (nightCaregiver) caregiverName = nightCaregiver.name;
                    }
                    const caregiverElement =
                        document.getElementById("caregiverName");
                    if (caregiverName) {
                        caregiverElement.innerHTML = `${caregiverName} is here tonight ${heartEmoji}`;
                        caregiverElement.style.display = "block";
                    } else {
                        caregiverElement.style.display = "none";
                    }
                } else {
                    const substitute = SUBSTITUTE_CAREGIVERS.find(
                        (c) => c.date === todayDateString,
                    );
                    if (substitute) {
                        caregiverName = substitute.name;
                    } else {
                        const weeklyCaregiver = WEEKLY_CAREGIVERS.find(
                            (c) => c.dayOfWeek === todayDayOfWeek,
                        );
                        if (weeklyCaregiver)
                            caregiverName = weeklyCaregiver.name;
                    }
                    const caregiverElement =
                        document.getElementById("caregiverName");
                    if (caregiverName) {
                        caregiverElement.innerHTML = `${caregiverName} is here today ${heartEmoji}`;
                        caregiverElement.style.display = "block";
                    } else {
                        caregiverElement.style.display = "none";
                    }
                }
            }

            function displayReminders() {
                const now = new Date();
                const currentTime = `${now.getHours().toString().padStart(2, "0")}:${now.getMinutes().toString().padStart(2, "0")}`;
                const remindersList = document.getElementById("remindersList");
                remindersList.innerHTML = "";

                const scheduleItems = allReminders.filter(
                    (r) => r.schedule === true,
                );

                if (scheduleItems.length === 0) {
                    remindersList.innerHTML =
                        '<div class="reminder-item">No events scheduled for today</div>';
                    return;
                }

                scheduleItems.forEach((reminder) => {
                    const item = document.createElement("div");
                    item.className = "reminder-item";
                    if (reminder.time < currentTime) {
                        item.classList.add("past-event");
                    }
                    const timeFormatted = formatTime12Hour(reminder.time);
                    item.innerHTML = `<span class="reminder-time">${reminder.icon} ${timeFormatted}</span><span class="reminder-text">${reminder.text}</span>`;
                    remindersList.appendChild(item);
                });
            }

            function displaySuggestions() {
                const today = new Date();
                const todayDayOfWeek = today.getDay();

                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, "0");
                const day = String(today.getDate()).padStart(2, "0");
                const todayDateString = `${year}-${month}-${day}`;

                const todayMonth = today.getMonth() + 1;
                const todayDay = today.getDate();
                const currentHour = today.getHours();
                const suggestionsList =
                    document.getElementById("suggestionsList");
                suggestionsList.innerHTML = "";
                let allSuggestions = [];

                const todayHoliday = HOLIDAYS.find(
                    (h) => h.month === todayMonth && h.day === todayDay,
                );
                if (todayHoliday) {
                    let textColor;
                    if (currentHour >= 21 || currentHour < 8) {
                        textColor = "#666666";
                    } else {
                        textColor = todayHoliday.color;
                    }
                    allSuggestions.push({
                        text: todayHoliday.text,
                        icon: todayHoliday.emoji,
                        color: textColor,
                        isHoliday: true,
                    });
                }

                SPECIFIC_SUGGESTIONS.forEach((suggestion) => {
                    if (suggestion.date === todayDateString) {
                        allSuggestions.push({
                            text: suggestion.text,
                            icon: suggestion.icon,
                        });
                    }
                });

                DAILY_SUGGESTIONS.forEach((suggestion) => {
                    allSuggestions.push({
                        text: suggestion.text,
                        icon: suggestion.icon,
                    });
                });

                WEEKLY_SUGGESTIONS.forEach((suggestion) => {
                    if (suggestion.dayOfWeek === todayDayOfWeek) {
                        allSuggestions.push({
                            text: suggestion.text,
                            icon: suggestion.icon,
                        });
                    }
                });

                const displaySuggestions = allSuggestions.slice(0, 3);

                if (displaySuggestions.length === 0) {
                    suggestionsList.innerHTML =
                        '<div class="reminder-item">Enjoy your day</div>';
                    return;
                }

                displaySuggestions.forEach((suggestion) => {
                    const item = document.createElement("div");
                    item.className = "reminder-item";
                    const colorStyle = suggestion.isHoliday
                        ? `style="color: ${suggestion.color};"`
                        : "";
                    item.innerHTML = `<span class="reminder-text" ${colorStyle}>${suggestion.icon} ${suggestion.text}</span>`;
                    suggestionsList.appendChild(item);
                });
            }

            function formatTime12Hour(time24) {
                const [hours, minutes] = time24.split(":");
                const hour = parseInt(hours);
                const ampm = hour >= 12 ? "PM" : "AM";
                const hour12 = hour % 12 || 12;
                return `${hour12}:${minutes} ${ampm}`;
            }

            function checkReminders() {
                const now = new Date();
                const currentTime = `${now.getHours().toString().padStart(2, "0")}:${now.getMinutes().toString().padStart(2, "0")}`;
                if (activeFeature) return;
                const featuredReminder = allReminders.find(
                    (r) => r.time === currentTime && r.featured,
                );
                if (featuredReminder) showFeaturedReminder(featuredReminder);
            }

            async function showFeaturedReminder(reminder) {
                activeFeature = reminder;
                const overlay = document.getElementById("featuredOverlay");
                const videoDiv = document.getElementById("featuredVideo");
                const iconEl = document.getElementById("featuredIcon");
                const timeEl = document.getElementById("featuredTime");
                const textEl = document.getElementById("featuredText");

                // Reset state from any previous overlay
                videoDiv.classList.remove("active");
                videoDiv.innerHTML = "";
                iconEl.style.display = "block";
                timeEl.style.display = "block";
                textEl.className = "featured-text";

                // Phase 1: Announcement (0:00 – 0:10)
                iconEl.textContent = reminder.icon;
                timeEl.textContent = formatTime12Hour(reminder.time);
                textEl.textContent = reminder.text;
                overlay.classList.add("active");
                await generateChime();

                if (reminder.videoId) {
                    // Phase 2: Countdown (0:10 – 0:20)
                    setTimeout(() => {
                        iconEl.style.display = "none";
                        timeEl.style.display = "none";
                        let count = 10;
                        textEl.className = "featured-text";
                        textEl.innerHTML = `<div class="featured-countdown-block"><div class="featured-countdown-label">Starting in</div><div class="featured-countdown-number" id="countdownNum">${count}</div></div>`;
                        const ticker = setInterval(() => {
                            count--;
                            const numEl =
                                document.getElementById("countdownNum");
                            if (count > 0) {
                                if (numEl) numEl.textContent = count;
                            } else {
                                clearInterval(ticker);
                                // Phase 3: Video (0:20 – 2:40)
                                textEl.innerHTML = "";
                                videoDiv.innerHTML = `<iframe src="https://www.youtube.com/embed/${reminder.videoId}?autoplay=1&mute=1&controls=0&rel=0&modestbranding=1" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
                                videoDiv.classList.add("active");
                            }
                        }, 1000);
                    }, 10000);

                    // Phase 4: Congrats (2:40 – 3:00)
                    setTimeout(() => {
                        videoDiv.classList.remove("active");
                        videoDiv.innerHTML = "";
                        textEl.className = "featured-text";
                        iconEl.style.display = "block";
                        timeEl.style.display = "none";
                        iconEl.textContent = "💙";
                        textEl.textContent =
                            "Great job! Remember to keep moving.";
                    }, 160000);

                    // Close at 3:00
                    setTimeout(() => {
                        overlay.classList.remove("active");
                        activeFeature = null;
                        textEl.className = "featured-text";
                        displayReminders();
                    }, 180000);
                } else {
                    // No video — original behavior
                    setTimeout(
                        () => {
                            overlay.classList.remove("active");
                            activeFeature = null;
                            displayReminders();
                        },
                        FEATURED_DURATION * 60 * 1000,
                    );
                }
            }

            function checkForRefresh() {
                const now = new Date();
                const currentHour = now.getHours();
                const currentMinute = now.getMinutes();
                if (
                    currentHour === 0 &&
                    currentMinute === 0 &&
                    !activeFeature
                ) {
                    console.log("Midnight refresh");
                    location.reload();
                    return;
                }
                const isWakingHours = currentHour >= 8 && currentHour < 22;
                const timeSinceLastCheck = Date.now() - lastRefreshCheck;
                const fifteenMinutes = 15 * 60 * 1000;
                if (isWakingHours && timeSinceLastCheck >= fifteenMinutes) {
                    if (activeFeature) {
                        console.log(
                            "Skipping refresh - featured reminder active",
                        );
                        lastRefreshCheck = Date.now();
                        return;
                    }
                    console.log("Waking hours refresh");
                    lastRefreshCheck = Date.now();
                    location.reload();
                }
            }

            function init() {
                // Generate holidays for the current year
                const currentYear = new Date().getFullYear();
                HOLIDAYS = getDynamicHolidays(currentYear);
                
                updateTime();
                updateWeather();
                generateReminders();
                displayCaregiver();
                setInterval(updateTime, 1000);
                setInterval(checkForRefresh, 60 * 1000);
                weatherUpdateInterval = setInterval(
                    updateWeather,
                    30 * 60 * 1000,
                );
                setInterval(() => {
                    const now = new Date();
                    if (now.getHours() === 0 && now.getMinutes() === 0) {
                        // Regenerate holidays for new year if it's midnight on Jan 1
                        if (now.getMonth() === 0 && now.getDate() === 1) {
                            HOLIDAYS = getDynamicHolidays(now.getFullYear());
                        }
                        generateReminders();
                    }
                }, 60 * 1000);
                console.log(
                    "Memory Display v6.5 initialized - Dynamic holidays enabled, styled countdown, muted autoplay",
                );
            }

            window.addEventListener("load", init);
        </script>
